    <rect x="250" y="214" width="180" height="34" rx="8" fill="#241f3a"/><text x="264" y="236">Qian Xun Ji</text>
    <rect x="440" y="214" width="200" height="34" rx="8" fill="#241f3a"/><text x="454" y="236">Fire Dragon Lizard OC</text>
