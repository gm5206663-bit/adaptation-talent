  <text x="1020" y="416" font-family="Verdana, sans-serif" font-size="12" fill="#8e88b5">the Talent translated, not copied</text>

  <!-- footer -->
  <rect x="40" y="500" width="1240" height="150" rx="14" fill="#1a1a30" stroke="#3a3a5e"/>
  <text x="70" y="540" font-family="Verdana, sans-serif" font-size="15" fill="#e8c76a">Every module: Identity · Local reality · Starting adaptation · Source architecture · Ledger · Progression path · Continuity (§71)</text>
  <text x="70" y="572" font-family="Verdana, sans-serif" font-size="13" fill="#b8b2d8">One locked universal core — 76 sections, version 2.0 — governs them all; a module never rewrites it (§76).</text>
  <text x="70" y="600" font-family="Verdana, sans-serif" font-size="13" fill="#b8b2d8">The Talent is never the holder&#8217;s power: it is the law that refines, integrates, and evolves their complete being along the best path their real life supports.</text>
  <text x="70" y="628" font-family="Verdana, sans-serif" font-size="12" fill="#8e88b5">adaptation-talent · canon/ · modules/ · docs/ · templates/ · provenance/</text>
</svg>
