  <text x="710" y="152" font-family="Verdana, sans-serif" font-size="15" fill="#6ac3e8" letter-spacing="1">MCU</text>
  <g font-family="Verdana, sans-serif" font-size="13" fill="#e8e6f5">
    <rect x="710" y="170" width="240" height="34" rx="8" fill="#1a2a3a"/><text x="724" y="192">Mark Howard Stark</text>
    <rect x="710" y="214" width="240" height="34" rx="8" fill="#1a2a3a"/><text x="724" y="236">The Eternal OC (E-199999)</text>
