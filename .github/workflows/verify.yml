name: verify

# The repository checks itself on every push:
#   1. every tracked file hash-matches MANIFEST.sha256
#   2. every relative markdown link resolves
# A red run means one of those two guarantees broke — fix the file,
# refresh the manifest (sh tools/refresh-manifest.sh), commit both together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify the repository against itself
        run: python3 tools/check.py
      - name: Counts (the register agrees with the prose)
        run: python3 tools/check_counts.py
